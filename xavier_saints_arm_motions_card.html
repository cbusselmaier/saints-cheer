<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xavier Saints — Arm Motion Reference</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #111; color: #f0f0f0; min-height: 100vh; }

  /* Header */
  .hdr { background: #000; border-bottom: 2px solid #D4A017; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
  .hdr-title { font-size: 18px; font-weight: 700; letter-spacing: .04em; color: #fff; }
  .hdr-sub { font-size: 12px; color: #D4A017; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
  .legend { display: flex; gap: 8px; }
  .leg { font-size: 11px; padding: 3px 10px; border-radius: 99px; font-weight: 600; }
  .leg-do   { background: #0d3d28; color: #4ecca8; border: 1px solid #2a7a58; }
  .leg-dont { background: #3d0d0d; color: #f08080; border: 1px solid #7a2a2a; }

  /* Grid */
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; padding: 16px; }
  @media (max-width: 700px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 450px) { .grid { grid-template-columns: repeat(2, 1fr); } }

  .card { background: #1a1a1a; border: 1.5px solid #2a2a2a; border-radius: 10px; overflow: hidden; cursor: pointer; transition: border-color .18s, transform .12s; }
  .card:hover { border-color: #D4A017; transform: translateY(-2px); }
  .card.active { border-color: #D4A017; box-shadow: 0 0 0 2px #D4A01740; }
  .card img { width: 100%; display: block; }
  .card-lbl { padding: 6px 8px 8px; text-align: center; border-top: 1px solid #2a2a2a; }
  .card-name { font-size: 11px; font-weight: 700; color: #fff; text-transform: uppercase; letter-spacing: .05em; }
  .card-sub  { font-size: 10px; color: #D4A017; margin-top: 1px; }

  /* Detail panel */
  .detail { display: none; margin: 0 16px 16px; background: #1a1a1a; border: 1.5px solid #D4A017; border-radius: 12px; overflow: hidden; }
  .detail.open { display: block; }
  .detail-inner { display: flex; gap: 0; }
  .detail-img { flex: 0 0 55%; max-width: 55%; }
  .detail-img img { width: 100%; display: block; }
  .detail-body { flex: 1; padding: 16px 18px; overflow-y: auto; }
  @media (max-width: 650px) { .detail-inner { flex-direction: column; } .detail-img { max-width: 100%; } }

  .d-badge { display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: #D4A017; color: #000; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 8px; }
  .d-name   { font-size: 20px; font-weight: 800; color: #fff; line-height: 1.1; }
  .d-sub    { font-size: 12px; color: #D4A017; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; margin: 2px 0 4px; }
  .d-desc   { font-size: 12px; color: #aaa; margin-bottom: 14px; font-style: italic; }

  .section-lbl { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: #666; margin: 12px 0 6px; }
  .cues { display: flex; flex-direction: column; gap: 5px; }
  .cue  { font-size: 12px; padding: 6px 10px; border-radius: 6px; display: flex; gap: 8px; line-height: 1.4; }
  .cue-do   { background: #0d3d28; color: #a8f0d4; border-left: 3px solid #2db882; }
  .cue-dont { background: #3d0d0d; color: #f0a8a8; border-left: 3px solid #cc3333; }
  .cue-pos  { background: #1a2840; color: #a8c8f0; border-left: 3px solid #3366cc; }
  .cue-tech { background: #1e1a10; color: #f0dca8; border-left: 3px solid #cc9933; }
  .cue-icon { flex-shrink: 0; font-weight: 700; }

  .nav { display: flex; justify-content: space-between; margin-top: 16px; gap: 8px; }
  .nav button { flex: 1; padding: 8px 12px; background: #222; border: 1px solid #333; border-radius: 8px; color: #ccc; font-size: 12px; cursor: pointer; transition: background .15s, border-color .15s; text-align: center; }
  .nav button:hover { background: #2a2a2a; border-color: #D4A017; color: #fff; }
  .nav .spacer { flex: 1; }

  .footer { text-align: center; padding: 14px; font-size: 11px; color: #444; border-top: 1px solid #1a1a1a; }
  .footer span { color: #D4A017; font-weight: 700; }
</style>
</head>

    lbl.className = 'card-lbl';
    lbl.innerHTML = `<div class="card-name">${m.name}</div><div class="card-sub">${m.subtitle}</div>`;
    c.appendChild(img); c.appendChild(lbl);
    g.appendChild(c);
  });
}

function show(idx) {
  if (cur === idx) {
    cur = null;
    document.getElementById('detail').classList.remove('open');
    document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
    return;
  }
  cur = idx;
  document.querySelectorAll('.card').forEach((c,i) => c.classList.toggle('active', i===idx));
  const m = MOTIONS[idx];

  const pos   = m.position.map(p  => `<div class="cue cue-pos"><span class="cue-icon">▸</span><span>${p}</span></div>`).join('');
  const tech  = m.technique.map(t => `<div class="cue cue-tech"><span class="cue-icon">★</span><span>${t}</span></div>`).join('');
  const donts = m.donts.map(d     => `<div class="cue cue-dont"><span class="cue-icon">✗</span><span>${d}</span></div>`).join('');

  const prev = idx > 0
    ? `<button onclick="show(${idx-1})">← ${MOTIONS[idx-1].name}</button>`
    : '<div class="spacer"></div>';
  const next = idx < MOTIONS.length-1
    ? `<button onclick="show(${idx+1})">${MOTIONS[idx+1].name} →</button>`
    : '<div class="spacer"></div>';

  document.getElementById('detail').innerHTML = `
    <div class="detail-inner">
      <div class="detail-img"><img src="${IMGS[idx]}" alt="${m.name}"></div>
      <div class="detail-body">
        <div class="d-badge">${idx+1} of ${MOTIONS.length}</div>
        <div class="d-name">${m.name}</div>
        <div class="d-sub">${m.subtitle}</div>
        <div class="d-desc">${m.desc}</div>
        <div class="section-lbl">📍 Position</div>
        <div class="cues">${pos}</div>
        <div class="section-lbl">⚡ Key Technique</div>
        <div class="cues">${tech}</div>
        <div class="section-lbl">✗ Don't</div>
        <div class="cues">${donts}</div>
        <div class="nav">${prev}${next}</div>
      </div>
    </div>`;

  const det = document.getElementById('detail');
  det.classList.add('open');
  det.scrollIntoView({behavior:'smooth', block:'nearest'});
}

buildGrid();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xavier Saints — Jump Reference</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#111;color:#f0f0f0;min-height:100vh;}
  .hdr{background:#000;border-bottom:2px solid #827554;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  .hdr-title{font-size:18px;font-weight:700;letter-spacing:.04em;color:#fff;}
  .hdr-sub{font-size:12px;color:#827554;font-weight:600;letter-spacing:.08em;text-transform:uppercase;}
  .back{font-size:12px;color:#827554;text-decoration:none;padding:4px 10px;border:1px solid #4a4030;border-radius:99px;}
  .back:hover{background:#1a1a1a;}
  .legend{display:flex;gap:8px;flex-wrap:wrap;}
  .leg{font-size:11px;padding:3px 10px;border-radius:99px;font-weight:600;}
  .leg-b{background:#0d3d28;color:#4ecca8;border:1px solid #2a7a58;}
  .leg-i{background:#2a1a00;color:#f0c060;border:1px solid #7a5000;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:16px;}
  @media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr);}}
  .card{background:#1a1a1a;border:1.5px solid #2a2a2a;border-radius:12px;overflow:hidden;cursor:pointer;transition:border-color .18s,transform .12s;}
  .card:hover{border-color:#827554;transform:translateY(-2px);}
  .card.active{border-color:#827554;box-shadow:0 0 0 2px #82755440;}
  .card img{width:100%;display:block;}
  .card-lbl{padding:8px 10px 10px;border-top:1px solid #2a2a2a;}
  .card-name{font-size:13px;font-weight:800;color:#fff;text-transform:uppercase;letter-spacing:.05em;}
  .card-sub{font-size:11px;color:#827554;margin-top:1px;}
  .card-level{display:inline-block;font-size:9px;font-weight:700;padding:2px 7px;border-radius:99px;margin-top:4px;text-transform:uppercase;letter-spacing:.06em;}
  .lvl-b{background:#0d3d28;color:#4ecca8;}
  .lvl-bi{background:#1a2a10;color:#90d870;}
  .lvl-i{background:#2a1a00;color:#f0c060;}
  .detail{display:none;margin:0 16px 16px;background:#1a1a1a;border:1.5px solid #827554;border-radius:14px;overflow:hidden;}
  .detail.open{display:block;}
  .d-top{display:flex;}
  .d-img{flex:0 0 52%;max-width:52%;}
  .d-img img{width:100%;display:block;}
  .d-body{flex:1;padding:16px 18px;overflow-y:auto;max-height:520px;}
  @media(max-width:650px){.d-top{flex-direction:column;}.d-img{max-width:100%;}.d-body{max-height:none;}}
  .d-badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;background:#827554;color:#000;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px;}
  .d-name{font-size:22px;font-weight:800;color:#fff;line-height:1.1;}
  .d-sub{font-size:12px;color:#827554;font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin:3px 0 5px;}
  .d-desc{font-size:12px;color:#aaa;margin-bottom:12px;font-style:italic;line-height:1.5;}
  .d-used{font-size:11px;color:#666;margin-bottom:14px;}
  .d-used span{color:#888;}
  .phases{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid #2a2a2a;border-radius:8px;overflow:hidden;margin-bottom:14px;}
  .phase-btn{padding:7px 4px;text-align:center;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;cursor:pointer;color:#666;background:#111;border:none;transition:background .15s,color .15s;}
  .phase-btn.act{background:#222;color:#827554;border-bottom:2px solid #827554;}
  .phase-btn:hover:not(.act){background:#1a1a1a;color:#aaa;}
  .phase-content{display:none;}
  .phase-content.show{display:block;}
  .section-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#555;margin:10px 0 5px;}
  .bullets{list-style:none;display:flex;flex-direction:column;gap:4px;}
  .bullets li{font-size:12px;color:#ccc;padding:5px 10px;background:#141414;border-left:3px solid #333;border-radius:0 5px 5px 0;line-height:1.4;}
  .cues{display:flex;flex-direction:column;gap:5px;margin-top:10px;}
  .cue{font-size:12px;padding:6px 10px;border-radius:6px;display:flex;gap:8px;line-height:1.4;}
  .cue-do{background:#0d3d28;color:#a8f0d4;border-left:3px solid #2db882;}
  .cue-dont{background:#3d0d0d;color:#f0a8a8;border-left:3px solid #cc3333;}
  .cue-safety{background:#2a2000;color:#f0d890;border-left:3px solid #cc9900;}
  .cue-icon{flex-shrink:0;font-weight:700;}
  .nav{display:flex;justify-content:space-between;margin-top:14px;gap:8px;}
  .nav button{flex:1;padding:8px 12px;background:#222;border:1px solid #333;border-radius:8px;color:#ccc;font-size:12px;cursor:pointer;transition:background .15s,border-color .15s;}
  .nav button:hover{background:#2a2a2a;border-color:#827554;color:#fff;}
  .nav .spacer{flex:1;}
  .footer{text-align:center;padding:14px;font-size:11px;color:#444;border-top:1px solid #1a1a1a;}
  .footer span{color:#827554;font-weight:700;}
</style>
</head>

const JUMPS = [{"name": "Tuck", "subtitle": "The beginner jump", "level": "BEGINNER", "desc": "Both knees pull up tight to chest at the peak. Arms stay in a High V or T. The most accessible jump for beginners.", "used": ["Day 2 warm-up", "Any cheer with a jump count"], "approach": ["2 clap\u2013clap, in releve", "Swing arms down\u2013up", "Pull knees tight to chest"], "peak": ["Knees tight to chest", "Arms in high V or T", "High toes"], "landing": ["Land on balls of both feet", "Soft knees", "Smiling"], "dos": ["Pull knees tight to your chest", "Point your toes at peak", "Hold your arm motion through the jump"], "donts": ["Round your back or look at knees", "Letting feet drop before landing", "Arms collapsing mid-jump"], "safety": ["Land with soft bent knees every time", "Never lock knees on landing", "Practice the landing before the jump"]}, {"name": "Spread Eagle", "subtitle": "The classic jump", "level": "BEGINNER", "desc": "Arms in a high X, legs spread wide in a straddle at the peak. The most visually recognizable cheer jump.", "used": ["Day 3 jump showcase", "Performance day"], "approach": ["2 side steps", "Swing arms down and back"], "peak": ["Legs wide in straddle", "Arms in high V", "High toes"], "landing": ["Feet together before landing", "Soft knees"], "dos": ["Point toes the whole time", "Keep hips level \u2014 both sides even", "Arms stay in High V throughout"], "donts": ["Let arms drop during the jump", "One leg higher than the other", "Landing with feet still apart"], "safety": ["Stretch hip flexors and inner thighs daily", "Width comes from flexibility \u2014 don't force it", "Bring feet together before ground contact"]}, {"name": "Herkie", "subtitle": "The classic asymmetric", "level": "INTERMEDIATE", "desc": "One leg extends out to the side, while the other leg bends with the knee down.", "used": ["Day 3 jump sequence", "Advanced showcase"], "approach": ["Drive knee upward", "Kick out leg out", "Pick toes"], "peak": ["Extended leg parallel to ground", "Back straight", "Full arms strong"], "landing": ["Kick first together", "Soft knee bend on landing"], "dos": ["Extend your kick leg before you jump", "Keep your back straight at peak", "Point toes on extended leg"], "donts": ["Lean your torso toward kick leg", "Letting the extended leg drop low", "Looking down at your legs"], "safety": ["Know which leg is your kick leg \u2014 practice one side first", "Hip flexor flexibility prevents knee strain", "Don't force height before your hip flexors are ready"]}, {"name": "Right / Left Hurdler", "subtitle": "The hurdle", "level": "INTERMEDIATE", "desc": "One leg extends straight forward (like a hurdle), the other leg bends back.", "used": ["Day 5 advanced jump practice", "Showcase"], "approach": ["3-step approach, accelerate", "Foot dominant leg", "Over arm knee-height"], "peak": ["Front leg straight and face pointed", "Back leg bent", "Shoulders square"], "landing": ["Feet flat together", "Upright through the landing"], "dos": ["Bring your front leg up with power", "Point toes on the front leg", "Keep your chest up and shoulders square"], "donts": ["Crunch front leg or round", "Back leg just hanging (should be actively bent)", "Landing on the front leg first"], "safety": ["Hamstring flexibility determines your front leg height \u2014 stretch daily", "Don't force the front leg higher than your flexibility allows", "Torso upright protects your lower back"]}, {"name": "Pike", "subtitle": "The precision jump", "level": "INTERMEDIATE", "desc": "Both legs extend directly forward together, parallel to the ground, while arms reach toward the toes.", "used": ["Advanced practice drills", "After camp"], "approach": ["2-step approach", "Swing arms forward"], "peak": ["Legs straight together", "Reach for your toes", "Back stays strong"], "landing": ["Bring legs down together", "Absorb with knees"], "dos": ["Keep legs together and straight", "Reach for your toes actively \u2014 not just arms forward", "Compress the position \u2014 tight and sharp"], "donts": ["Round your back or separate legs", "Bending knees to reach hands", "Legs separating"], "safety": ["Only attempt after demonstrating hamstring flexibility", "Tight back = back strain risk \u2014 stretch first", "Master Tuck and Spread Eagle before attempting Pike"]}, {"name": "Toe Touch", "subtitle": "The iconic jump", "level": "INTERMEDIATE", "desc": "Both legs kick out to the sides at 90\u00b0 (like a spread eagle), while arms swing down and try to touch the toes.", "used": ["Day 5 jump showcase", "Performance day"], "approach": ["2-step approach", "Strong arms swing down then out"], "peak": ["Legs wide wide", "Arms reach down toward toes", "High toes!"], "landing": ["Both feet together", "Soft knees"], "dos": ["Point toes the whole time", "Let the arm swing drive the jump", "Keep hips level \u2014 both legs at same height"], "donts": ["Let forward arm swing pull you off your kick", "Rounding your back to reach toes", "Piking your hips forward"], "safety": ["Inner thigh and hip flexibility determines your width \u2014 stretch daily", "Never force the legs wider than feels comfortable", "The arm swing must match the leg kick in timing \u2014 drill slowly first"]}];
let cur=null,curTab={};
function lvlClass(lv){return lv==='BEGINNER'?'lvl-b':lv==='BEGINNER–INTERMEDIATE'?'lvl-bi':'lvl-i';}
function buildGrid(){
  const g=document.getElementById('grid');
  JUMPS.forEach((j,i)=>{
    const c=document.createElement('div');
    c.className='card';c.id='card'+i;c.onclick=()=>show(i);
    c.innerHTML=`<img src="${GRID_IMGS[i]}" alt="${j.name}" loading="lazy"><div class="card-lbl"><div class="card-name">${j.name}</div><div class="card-sub">${j.subtitle}</div><span class="card-level ${lvlClass(j.level)}">${j.level}</span></div>`;
    g.appendChild(c);
  });
}
function renderPhase(idx,tab){
  const j=JUMPS[idx];curTab[idx]=tab;
  const phases=['approach','peak','landing'];
  const labels=['1 · Approach (Prep)','2 · Peak (The Shape)','3 · Landing (Absorb)'];
  const data=[j.approach,j.peak,j.landing];
  const tabs=phases.map((p,ti)=>`<button class="phase-btn${tab===p?' act':''}" onclick="setTab(${idx},'${p}')">  ${labels[ti]}</button>`).join('');
  const content=phases.map((p,ti)=>`<div class="phase-content${tab===p?' show':''}" id="ph_${idx}_${p}"><ul class="bullets">${data[ti].map(x=>`<li>${x}</li>`).join('')}</ul></div>`).join('');
  const dos=j.dos.map(d=>`<div class="cue cue-do"><span class="cue-icon">✓</span><span>${d}</span></div>`).join('');
  const donts=j.donts.map(d=>`<div class="cue cue-dont"><span class="cue-icon">✗</span><span>${d}</span></div>`).join('');
  const safety=j.safety.map(s=>`<div class="cue cue-safety"><span class="cue-icon">⚠</span><span>${s}</span></div>`).join('');
  const used=j.used.map(u=>`<span>${u}</span>`).join(' · ');
  const prev=idx>0?`<button onclick="show(${idx-1})">← ${JUMPS[idx-1].name}</button>`:'<div class="spacer"></div>';
  const next=idx<JUMPS.length-1?`<button onclick="show(${idx+1})">${JUMPS[idx+1].name} →</button>`:'<div class="spacer"></div>';
  return `<div class="d-top"><div class="d-img"><img src="${DETAIL_IMGS[idx]}" alt="${j.name}"></div><div class="d-body"><div class="d-badge">${idx+1} of ${JUMPS.length}</div><div class="d-name">${j.name}</div><div class="d-sub">${j.subtitle}</div><div class="d-desc">${j.desc}</div><div class="d-used">📌 Used in: <span>${used}</span></div><div class="phases">${tabs}</div>${content}<div class="section-lbl">✓ Do</div><div class="cues">${dos}</div><div class="section-lbl">✗ Don't</div><div class="cues">${donts}</div><div class="section-lbl">⚠ Safety & Coach Notes</div><div class="cues">${safety}</div><div class="nav">${prev}${next}</div></div></div>`;
}
function setTab(idx,tab){document.getElementById('detail').innerHTML=renderPhase(idx,tab);}
function show(idx){
  if(cur===idx){cur=null;document.getElementById('detail').classList.remove('open');document.querySelectorAll('.card').forEach(c=>c.classList.remove('active'));return;}
  cur=idx;
  document.querySelectorAll('.card').forEach((c,i)=>c.classList.toggle('active',i===idx));
  document.getElementById('detail').innerHTML=renderPhase(idx,curTab[idx]||'approach');
  const det=document.getElementById('detail');
  det.classList.add('open');
  det.scrollIntoView({behavior:'smooth',block:'nearest'});
}
buildGrid();
</script>
